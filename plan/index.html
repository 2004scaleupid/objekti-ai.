<!doctype html><html lang="et"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' 'unsafe-inline' https://cdn.jsdelivr.net; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src https://fonts.gstatic.com; img-src 'self' data: blob: https:; connect-src 'self' https://*.supabase.co data: blob:; worker-src 'self' blob:; object-src 'none'; base-uri 'none'; frame-ancestors 'self'">
<title>Sündmuse plaan · Vaade3D</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter+Tight:wght@400;500;600;700;800&display=swap">
<style>
:root{--bg:#EEEAE4;--paper:#FBFAF7;--ink:#16130F;--mut:#6f685f;--line:#DDD7CE;--acc:#E5482D;--ok:#2f7a43}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.45 "Inter Tight",Helvetica,Arial,sans-serif;-webkit-font-smoothing:antialiased}
header{display:flex;align-items:center;gap:12px;flex-wrap:wrap;padding:12px 16px;border-bottom:1px solid var(--line);background:var(--paper)}
header b{font-size:17px;letter-spacing:-.02em}header b em{color:var(--acc);font-style:normal}
header .sp{flex:1}
select,button{font:inherit;color:inherit;border:1px solid var(--line);background:#fff;border-radius:10px;padding:8px 12px}
button{cursor:pointer;font-weight:600}button.pri{background:var(--ink);color:#fff;border-color:var(--ink)}
main{display:grid;grid-template-columns:minmax(0,1fr) 340px;gap:16px;padding:16px;max-width:1500px;margin:0 auto}
.card{background:var(--paper);border:1px solid var(--line);border-radius:14px;padding:14px}
#plan svg{width:100%;height:auto;display:block}
#plan{padding:8px;overflow:auto;-webkit-overflow-scrolling:touch}
h1{font-size:22px;letter-spacing:-.02em;margin:0 0 4px}h2{font-size:14px;margin:0 0 8px;text-transform:uppercase;letter-spacing:.06em;color:var(--mut)}
.meta{color:var(--mut);font-size:13.5px;margin:0 0 10px}
.tabs{display:flex;gap:6px;flex-wrap:wrap;margin:8px 0 10px}.tabs button{padding:6px 10px;font-size:13px}.tabs button[aria-pressed=true]{background:var(--ink);color:#fff;border-color:var(--ink)}
.epck{list-style:none;margin:0;padding:0;display:grid;gap:4px}.epck li{font-size:14px}.epck .ok{color:var(--ok)}.epck .no{color:var(--acc);font-weight:600}
.eplg{list-style:none;margin:0;padding:0;display:grid;grid-template-columns:1fr 1fr;gap:6px 10px;font-size:13px}.eplg i{display:inline-block;width:16px;height:12px;border:1px solid #0002;border-radius:2px;margin-right:6px;vertical-align:-1px}
.epbom{width:100%;border-collapse:collapse;font-size:13.5px}.epbom td,.epbom th{padding:5px 4px;border-bottom:1px solid var(--line);text-align:left}.epbom td:last-child,.epbom th:last-child{text-align:right;font-variant-numeric:tabular-nums}.epbom small{font-size:10px;color:var(--mut);border:1px solid var(--line);border-radius:4px;padding:0 3px}
.fail{border-color:#f0b3a6;background:#fff5f2}.fail p{margin:0 0 8px}
.fix{display:block;width:100%;text-align:left;margin:6px 0 0;font-weight:500}.fix b{color:var(--ok)}
.mhint{display:none}@media (max-width:900px){.mhint{display:block}}
.side{display:grid;gap:12px;align-content:start}
#busy{color:var(--mut);font-size:14px}
@media (max-width:900px){main{grid-template-columns:minmax(0,1fr);padding:12px}section,.card{min-width:0}#plan svg{width:900px;max-width:none}header{padding:10px 12px}}
@media print{@page{size:A4 landscape;margin:10mm}body{background:#fff}header,.tabs,.noprint,.fix{display:none!important}main{display:block;padding:0}.card{border:0;padding:0;break-inside:avoid}#plan{margin-bottom:6mm;overflow:visible;padding:0}#plan svg{width:100%!important;height:auto;max-height:150mm;max-width:none}.mhint{display:none}@media (max-width:900px){.mhint{display:block}}
.side{display:grid;grid-template-columns:1fr 1fr 1fr;gap:6mm}}
</style></head><body>
<header><b>Vaade<em>3D</em> · Sündmuse plaan</b><span class="sp"></span>
<label class="noprint">Näide <select id="case"></select></label><button id="print" class="pri">Prindi / PDF</button></header>
<main>
  <section><div class="card"><h1 id="title">…</h1><p class="meta" id="meta"></p><div class="tabs" id="tabs"></div><p class="meta noprint mhint">Telefonis lohista plaani külgedele.</p><div id="plan"><p id="busy">Arvutan paigutust…</p></div></div></section>
  <aside class="side">
    <div class="card" id="failbox" hidden></div>
    <div class="card"><h2>Kontroll</h2><div id="checks"></div></div>
    <div class="card"><h2>Tingmärgid</h2><div id="legend"></div></div>
    <div class="card"><h2>Tooted pakkumiseks</h2><div id="bom"></div></div>
  </aside>
</main>
<script src="../js/eventplan.js"></script>
<script src="../js/eventplan-svg.js"></script>
<script>var module={exports:{}};</script><script src="../tests/eventplan.cases.js"></script><script>window.CASES=module.exports;delete window.module;</script>
<script>
const $=id=>document.getElementById(id),EPS=EventPlan.svg,fmt=EventPlan.fmt;
let CAT=null,res=null,cur=0,view=null;
const W=new Worker('worker.js');let seq=0;const wait={};
W.onmessage=e=>{const f=wait[e.data.id];delete wait[e.data.id];if(f)f(e.data);};
const solve=(spec)=>new Promise(r=>{const id=++seq;wait[id]=r;W.postMessage({id,spec,cat:CAT});});
$('case').innerHTML=Object.entries(CASES).map(([k,c])=>`<option value="${k}">${c.name}</option>`).join('');
const q=new URLSearchParams(location.search);if(q.get('case'))$('case').value=q.get('case');
$('case').onchange=()=>{history.replaceState(null,'','?case='+$('case').value);run();};
$('print').onclick=()=>print();
function show(L,label){
  view=L;$('plan').innerHTML=EPS.svg(L,{width:1100});
  $('checks').innerHTML=EPS.checksHtml(L);$('legend').innerHTML=EPS.legendHtml(L);$('bom').innerHTML=EPS.bomHtml(L);
  const t=L.tent?L.tent.name:'Väliala '+fmt(L.room.W)+' × '+fmt(L.room.L)+' m';
  $('meta').textContent=[t,L.spec.guests?L.spec.guests+' külalist':'',label||''].filter(Boolean).join(' · ');
}
async function run(){
  const spec=CASES[$('case').value];$('title').textContent=spec.name;$('plan').innerHTML='<p id="busy">Arvutan paigutust…</p>';$('tabs').innerHTML='';$('failbox').hidden=true;
  const t0=performance.now();const d=await solve(spec);if(d.err){$('plan').textContent=d.err;return;}res=d.r;
  console.log('solve ms',Math.round(performance.now()-t0));
  if(res.ok){
    $('tabs').innerHTML=res.layouts.map((L,i)=>`<button data-i="${i}" aria-pressed="${i===0}">${i+1}. ${L.tent?fmt(L.tent.W)+' × '+fmt(L.tent.L)+' m':'Paigutus'}</button>`).join('');
    $('tabs').onclick=e=>{const b=e.target.closest('button');if(!b)return;[...$('tabs').children].forEach(x=>x.setAttribute('aria-pressed',x===b));show(res.layouts[+b.dataset.i]);};
    show(res.layouts[0]);
  }else{
    const fb=$('failbox');fb.hidden=false;fb.className='card fail';
    fb.innerHTML=`<h2 style="color:var(--acc)">Ei mahu</h2><p>${res.reason}</p>${res.fixes.length?'<p><b>Kontrollitud lahendused:</b></p>'+res.fixes.map((f,i)=>`<button class="fix" data-f="${i}">${f.text.replace(' → ',' → <b>')}</b></button>`).join(''):''}`;
    fb.onclick=e=>{const b=e.target.closest('[data-f]');if(!b)return;const f=res.fixes[+b.dataset.f];show(f.layout,'Lahendus: '+f.text.split(' → ')[0]);};
    if(res.closest)show(res.closest,'Lähim paigutus: punased ei mahu');
  }
}
fetch('../js/catalog/funrent.json').then(r=>r.json()).then(c=>{CAT=c;run();});
</script></body></html>

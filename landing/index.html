<!doctype html>
<html lang="et">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="description" content="Vaata maja 3D-s. Ära sõida kohale. Sisesta aadress ja saad maja 3D-mudeli koos katuse, seinte ja krundi mõõtudega.">
<meta property="og:title" content="Vaade3D · maja 3D-vaade ja mõõdud aadressi järgi">
<meta property="og:description" content="Vaata maja 3D-s. Ära sõida kohale.">
<meta property="og:image" content="vaade3d-poster.jpg">
<link rel="icon" href="../logo.svg" type="image/svg+xml">
<title>Vaade3D</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter+Tight:wght@500;600;700;800&family=JetBrains+Mono:wght@400;500&display=swap">
<style>
/* Vaade3D stiilijuhend: soe beež paber, peaaegu must tint, üks punakasoranž aktsent. Numbrid monospace. */
:root{
  --bg:#EEEAE4; --paper:#F8F6F2; --ink:#16130F; --muted:#77706A; --line:#DDD7CE; --soft:#E7E2DA;
  --accent:#E5482D; --ok:#2F7D4F; --okbg:#E3EFE7;
  --sans:"Inter Tight","Helvetica Neue",Arial,sans-serif;
  --mono:"JetBrains Mono",ui-monospace,SFMono-Regular,Menlo,monospace;
  color-scheme:light;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#191715;--paper:#22201D;--ink:#F1ECE5;--muted:#A39B92;--line:#37322D;--soft:#2B2825;--accent:#F0603F;--ok:#5BB27F;--okbg:#1F3227;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#191715;--paper:#22201D;--ink:#F1ECE5;--muted:#A39B92;--line:#37322D;--soft:#2B2825;--accent:#F0603F;--ok:#5BB27F;--okbg:#1F3227;color-scheme:dark}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--sans);font-size:14px;line-height:1.5;-webkit-font-smoothing:antialiased;margin:0}
button,input,textarea,select{font:inherit;color:inherit}
.wrap{max-width:1320px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
@media (min-width:760px){.wrap{padding-left:max(28px,env(safe-area-inset-left,0px));padding-right:max(28px,env(safe-area-inset-right,0px))}}
.lbl{font-family:var(--mono);font-size:11px;font-weight:500;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.num{font-family:var(--mono);font-variant-numeric:tabular-nums}
.muted{color:var(--muted)}
.note{font-size:12.5px;color:var(--muted);margin:0}
h1,h2,h3{margin:0;text-wrap:balance}
h1{font-size:clamp(38px,5.2vw,68px);line-height:1;letter-spacing:-.03em;font-weight:800}
h2{font-size:clamp(26px,3.2vw,40px);line-height:1.05;letter-spacing:-.025em;font-weight:800}
h3{font-size:17px;line-height:1.25;letter-spacing:-.01em;font-weight:700}
.ul{position:relative;white-space:nowrap;z-index:0}
.ul::after{content:"";position:absolute;left:-.04em;right:-.04em;bottom:.02em;height:.16em;background:var(--accent);transform:rotate(-1deg);z-index:-1}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;height:40px;padding:0 16px;border-radius:8px;border:1px solid var(--line);background:var(--bg);font-weight:600;font-size:14px;cursor:pointer;white-space:nowrap;transition:border-color .15s,background .15s}
.btn:hover{border-color:var(--muted)}
.btn.red{background:var(--accent);border-color:var(--accent);color:#fff;font-weight:700}
.btn.red:hover{filter:brightness(.94)}
.btn.dark{background:var(--ink);border-color:var(--ink);color:var(--bg)}
.btn.sm{height:32px;padding:0 11px;font-size:13px}
.btn.lg{height:48px;padding:0 20px;font-size:15px}
.btn.w{width:100%}
.btn[disabled]{opacity:.45;cursor:not-allowed}
.link{background:none;border:0;padding:0;cursor:pointer;text-decoration:underline;text-underline-offset:3px;color:var(--muted);font-size:13px}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.ic{width:20px;height:20px;flex:none}
input.f,textarea.f,select.f{width:100%;height:40px;border:1px solid var(--line);border-radius:8px;background:var(--paper);padding:0 12px;font-size:14px}
textarea.f{height:auto;min-height:72px;padding:9px 12px;resize:vertical}
input.f:focus,textarea.f:focus,select.f:focus{outline:none;border-color:var(--ink)}
label.fl{display:grid;gap:6px;font-size:13px;font-weight:600}
.err{color:var(--accent);font-size:13px;margin-top:6px}
.badge{display:inline-flex;align-items:center;font-family:var(--mono);font-size:10px;font-weight:500;letter-spacing:.08em;text-transform:uppercase;border-radius:4px;padding:2px 6px}
.badge.data{background:var(--soft);color:var(--muted)}
.badge.est{border:1px solid var(--accent);color:var(--accent)}
.status{display:inline-flex;align-items:center;gap:6px;font-size:11.5px;font-weight:700;border-radius:999px;padding:2px 9px;white-space:nowrap;border:1px solid transparent}
.status::before{content:"";width:6px;height:6px;border-radius:50%;background:currentColor}
.st-Mustand{background:var(--soft);color:var(--muted)}
.st-Saadetud{background:var(--ink);color:var(--bg)}
.st-Avatud{border-color:var(--accent);color:var(--accent)}
.st-Kinnitatud{background:var(--okbg);color:var(--ok)}
.toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:9px 14px;border-radius:8px;font-size:13.5px;z-index:50;max-width:calc(100% - 32px)}

/* prototype strip + header */
.proto{border-bottom:1px dashed var(--line)}
.proto-in{display:flex;flex-wrap:wrap;gap:4px 18px;align-items:center;justify-content:space-between;padding-block:6px;font-family:var(--mono);font-size:10.5px;color:var(--muted)}
.proto-in nav{display:flex;flex-wrap:wrap;gap:4px 14px}
.proto-in button{background:none;border:0;padding:0;cursor:pointer;font:inherit;color:var(--ink);text-decoration:underline;text-underline-offset:3px}
.proto-in button.on{color:var(--accent)}
.top{display:flex;align-items:center;justify-content:space-between;gap:16px;height:60px}
.logo{display:flex;align-items:center;gap:8px;font-weight:800;font-size:17px;letter-spacing:-.02em;background:none;border:0;padding:0;cursor:pointer;color:var(--ink)}
.logo svg{width:20px;height:20px}
.topnav{display:flex;align-items:center;gap:20px;font-size:14px;font-weight:600}
.topnav .navl{background:none;border:0;padding:0;cursor:pointer;color:var(--muted)}
.topnav .navl:hover{color:var(--ink)}
@media (max-width:760px){.topnav .navl{display:none}}

/* address search */
.addr{position:relative;flex:1;min-width:0}
.addr-box{display:flex;align-items:center;gap:8px;background:var(--paper);border:1px solid var(--line);border-radius:8px;padding:4px 4px 4px 10px}
.addr-box:focus-within{border-color:var(--ink)}
.addr-box input{flex:1;min-width:0;border:0;outline:none;height:32px;font-size:14px;background:transparent}
.addr-box .ic{color:var(--accent);width:18px;height:18px}
.addr-box .btn{height:32px}
.addr.big .addr-box{padding:6px 6px 6px 14px}
.addr.big .addr-box input{height:44px;font-size:16px}
.addr.big .addr-box .btn{height:44px}
.ac{position:absolute;z-index:30;left:0;right:0;top:calc(100% + 4px);list-style:none;margin:0;padding:4px;background:var(--paper);border:1px solid var(--line);border-radius:8px}
.ac li{display:flex;justify-content:space-between;gap:12px;padding:9px 10px;border-radius:6px;cursor:pointer}
.ac li:hover,.ac li.on{background:var(--soft)}
.ac .hint{cursor:default;color:var(--muted);font-size:13px}
.ac .hint:hover{background:none}

/* app shell */
.shell{background:var(--paper);border:1px solid var(--line);border-radius:10px}
.shell-top{display:flex;align-items:center;gap:12px;padding:8px 12px;border-bottom:1px solid var(--line)}
.s-logo{display:flex;align-items:center;gap:7px;font-weight:800;font-size:15px;letter-spacing:-.02em;flex:none}
.s-logo svg{width:18px;height:18px}
.price-pill{flex:none;font-family:var(--mono);font-size:12px;border:1px solid var(--accent);color:var(--accent);border-radius:999px;padding:4px 11px;white-space:nowrap;max-width:180px;overflow:hidden;text-overflow:ellipsis}
.price-pill.none{border-color:var(--line);color:var(--muted)}
.s-co{flex:none;font-weight:600;font-size:13px;white-space:nowrap}
@media (max-width:820px){.s-co,.s-logo b{display:none}.shell-top{flex-wrap:wrap}.price-pill{max-width:130px}}
.shell-body{display:grid;grid-template-columns:230px minmax(0,1fr) 340px;border-radius:0 0 10px 10px;overflow:hidden}
.shell.nolist .shell-body{grid-template-columns:minmax(0,1fr) 340px}
.s-list{border-right:1px solid var(--line);height:620px;overflow:auto;padding:8px;display:grid;gap:2px;align-content:start}
.s-list-h{display:flex;justify-content:space-between;align-items:center;padding:6px 8px 8px}
.s-item{display:grid;gap:3px;text-align:left;background:none;border:1px solid transparent;border-radius:6px;padding:9px 10px;cursor:pointer}
.s-item:hover{background:var(--soft)}
.s-item.on{background:var(--bg);border-color:var(--line)}
.s-item b{font-size:13.5px;font-weight:700}
.s-item .meta{display:flex;justify-content:space-between;align-items:center;gap:6px}
.s-stage{position:relative;height:620px;min-width:0;background:#CFDFEA}
.s-panel{border-left:1px solid var(--line);height:620px;overflow:auto;min-width:0}
@media (max-width:1100px){.shell-body{grid-template-columns:minmax(0,1fr) 340px}.s-list{display:none}}
@media (max-width:820px){.shell-body,.shell.nolist .shell-body{grid-template-columns:1fr}.s-stage{height:min(105vw,520px)}.s-panel{height:auto;border-left:0;border-top:1px solid var(--line)}}
.pills{position:absolute;top:10px;left:10px;right:10px;z-index:5;display:flex;flex-wrap:wrap;gap:4px;pointer-events:none}
.pills>div{display:flex;flex-wrap:wrap;gap:3px;padding:3px;border-radius:999px;background:rgba(255,255,255,.9);backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);pointer-events:auto}
.tool{height:30px;padding:0 12px;border-radius:999px;border:0;background:transparent;color:#16130F;font-size:12.5px;font-weight:600;cursor:pointer}
.tool:hover{background:rgba(22,19,15,.06)}
.tool.on{background:#16130F;color:#fff}
.attr-ov{position:absolute;left:10px;bottom:10px;z-index:5;font-family:var(--mono);font-size:10px;color:#16130F;background:rgba(255,255,255,.88);padding:3px 7px;border-radius:4px;pointer-events:none;max-width:calc(100% - 20px)}
.pbox{padding:16px;border-bottom:1px solid var(--line);display:grid;gap:10px}
.pbox:last-child{border-bottom:0}
.pbox-h{display:flex;justify-content:space-between;align-items:center;gap:10px}
.pbox h3{font-size:18px}
.mlist{display:grid}
.mrow{display:grid;grid-template-columns:1fr auto 28px;gap:8px;align-items:center;padding:7px 0;border-bottom:1px solid var(--line);min-height:40px}
.mrow:last-child{border-bottom:0}
.mrow .k{font-size:13.5px}
.mrow .v{font-family:var(--mono);font-size:14.5px;font-weight:500;font-variant-numeric:tabular-nums;text-align:right;white-space:nowrap}
.mrow .fix{display:block;font-family:var(--mono);font-size:10px;color:var(--accent);text-transform:uppercase;letter-spacing:.05em}
.pen{width:28px;height:28px;border:0;background:none;border-radius:6px;cursor:pointer;color:var(--muted);display:grid;place-items:center}
.pen:hover{background:var(--soft);color:var(--ink)}
.pen .ic{width:15px;height:15px}
.medit{display:flex;gap:4px;align-items:center;grid-column:2/4}
.medit input{width:84px;height:30px;text-align:right;font-family:var(--mono)}
.mat{display:grid;gap:6px}
.mat div{display:flex;justify-content:space-between;gap:10px;font-size:13px}
.mat b{font-family:var(--mono);font-weight:500;white-space:nowrap;font-variant-numeric:tabular-nums}
.res{display:flex;align-items:center;gap:6px;font-size:12.5px}
.res input{width:58px;height:30px;text-align:right;font-family:var(--mono)}
.pricecard{border:1px solid var(--accent);border-radius:8px;padding:14px;display:grid;gap:6px;background:var(--paper)}
.pc-price{font-weight:800;font-size:26px;letter-spacing:-.02em;line-height:1.1;color:var(--accent);white-space:pre-wrap;overflow-wrap:anywhere}
.pc-price.empty{color:var(--muted);font-size:16px;font-weight:600}
.addon{display:flex;justify-content:space-between;align-items:center;gap:8px;flex-wrap:wrap;font-size:13.5px}
.addon .num{color:var(--muted)}
.sent{font-size:12.5px;color:var(--ok);font-weight:700}
.photos{display:grid;grid-template-columns:repeat(auto-fill,minmax(56px,1fr));gap:6px}
.photos img{width:100%;aspect-ratio:1;object-fit:cover;border-radius:6px;border:1px solid var(--line)}
.filebtn{position:relative;overflow:hidden}
.filebtn input{position:absolute;inset:0;opacity:0;cursor:pointer}
.sharebox{display:flex;gap:6px}
.sharebox input{font-family:var(--mono);font-size:12px}
.chips{display:flex;flex-wrap:wrap;gap:5px}
.chip{font-size:12px;font-weight:600;background:var(--soft);border-radius:999px;padding:2px 9px}

/* viewer + labels */
.viewer{position:relative;width:100%;height:100%;overflow:hidden;touch-action:pan-y}
.viewer.box{height:auto;aspect-ratio:4/5;border-radius:8px}
.viewer canvas{display:block;width:100%!important;height:100%!important;cursor:grab}
.viewer canvas:active{cursor:grabbing}
.v-labels{position:absolute;inset:0;pointer-events:none}
.v-labels>div{position:absolute;left:0;top:0;font-family:var(--mono);font-size:11px;font-weight:500;line-height:1.3;border-radius:3px;padding:2px 6px;white-space:nowrap;will-change:transform}
.v-labels .dim{background:#E5482D;color:#fff}
.v-labels .dist{background:#16130F;color:#fff}
.v-labels .plot{background:#fff;color:#16130F;border:1px solid #16130F}
.v-labels .tag{background:#16130F;color:#fff;font-family:var(--sans);font-size:12px;font-weight:700;padding:4px 8px}

/* landing */
.intro{padding-block:28px 22px;display:grid;grid-template-columns:minmax(0,1.3fr) minmax(0,1fr);gap:16px 40px;align-items:end}
.intro p{margin:0;font-size:16px;line-height:1.55;max-width:34em}
.badges{display:flex;flex-wrap:wrap;gap:6px 16px;margin-top:12px;font-size:13px;color:var(--muted)}
.badges b{color:var(--accent)}
@media (max-width:860px){.intro{grid-template-columns:1fr}}
.try{display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap;padding-block:10px 0}
.band{padding-block:56px;border-top:1px solid var(--line)}
.band>.lbl{display:block;margin-bottom:18px}
.band h2{margin-bottom:22px;max-width:22em}
.promo{position:relative;margin-top:16px;border-radius:22px;overflow:hidden;border:1px solid var(--line);background:#16130F;aspect-ratio:16/9;box-shadow:0 30px 80px -40px rgba(60,20,10,.45)}.promo video{width:100%;height:100%;display:block;object-fit:cover}
/* mallid: enne/pärast võrdlus */
.mwrap{display:grid;grid-template-columns:minmax(0,1.1fr) minmax(0,1fr);gap:22px;align-items:start}
@media (max-width:860px){.mwrap{grid-template-columns:1fr}}
.cmp{position:relative;aspect-ratio:4/3;border-radius:12px;overflow:hidden;border:1px solid var(--line);background:#CFDFEA;user-select:none;touch-action:pan-y}
.cmp img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;display:block;pointer-events:none}
.cmp .aft{clip-path:inset(0 0 0 var(--x,50%))}
.cmp .bar{position:absolute;top:0;bottom:0;left:var(--x,50%);width:2px;margin-left:-1px;background:#fff;box-shadow:0 0 0 1px rgba(0,0,0,.12);pointer-events:none}
.cmp .bar::after{content:"↔";position:absolute;top:50%;left:50%;width:36px;height:36px;margin:-18px 0 0 -18px;border-radius:50%;background:#fff;color:#16130F;display:grid;place-items:center;font:600 15px var(--sans);box-shadow:0 6px 18px rgba(0,0,0,.2)}
.cmp input{position:absolute;inset:0;width:100%;height:100%;opacity:0;cursor:ew-resize;margin:0}
.cmp .cl{position:absolute;top:10px;font-family:var(--mono);font-size:10.5px;letter-spacing:.06em;text-transform:uppercase;background:rgba(255,255,255,.9);color:#16130F;border-radius:4px;padding:4px 8px;pointer-events:none}
.cmp .cl.l{left:10px}.cmp .cl.r{right:10px;background:#E5482D;color:#fff}
.mtabs{display:grid;gap:4px}
.mtab{display:grid;gap:2px;text-align:left;background:none;border:1px solid transparent;border-left:2px solid var(--line);border-radius:0 8px 8px 0;padding:10px 14px;cursor:pointer;color:var(--ink);transition:background .25s,border-color .25s}
.mtab b{font-size:15px}
.mtab span{font-size:13px;color:var(--muted)}
.mtab:hover{background:color-mix(in srgb,var(--paper) 60%,transparent)}
.mtab[aria-pressed="true"]{background:var(--paper);border-color:var(--line);border-left-color:var(--accent)}
#mallid .mstage{--wall:#F2EFEA;--wall2:#D9D3C9;--roof:#3A3D41;--roof2:#2C2E31}
.spot{display:grid;grid-template-columns:minmax(0,.8fr) minmax(0,1.2fr);gap:24px;align-items:stretch}
@media (max-width:860px){.spot{grid-template-columns:1fr}.mstage{order:-1}}
.tlist{display:grid;gap:2px;align-content:start;min-width:0}
.titem{position:relative;display:grid;gap:2px;text-align:left;background:none;border:0;border-radius:8px;padding:12px 14px 14px;cursor:pointer;color:var(--ink);font:inherit;transition:background .3s}
.titem .k{font-family:var(--mono);font-size:10.5px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted)}
.titem b{font-size:17px;letter-spacing:-.015em}
.titem p{margin:0;color:var(--muted);font-size:13.5px;max-height:0;opacity:0;overflow:hidden;transition:max-height .45s cubic-bezier(.2,.8,.2,1),opacity .3s}
.titem .mbar{position:absolute;left:14px;right:14px;bottom:4px;height:2px;background:var(--line);border-radius:2px;overflow:hidden;opacity:0}
.titem .mbar i{display:block;height:100%;width:100%;background:var(--accent);transform-origin:0 50%;transform:scaleX(0)}
.titem:hover{background:color-mix(in srgb,var(--paper) 60%,transparent)}
.titem.on{background:var(--paper)}
.titem.on p{max-height:60px;opacity:1}
.titem.on .mbar{opacity:1}
.titem.on .mbar i{animation:fill var(--dur,4200ms) linear forwards}
.spot.paused .titem.on .mbar i{animation-play-state:paused}
@keyframes fill{to{transform:scaleX(1)}}
.titem:focus-visible{outline:2px solid var(--accent);outline-offset:2px}

.mstage{position:relative;border-radius:14px;overflow:hidden;border:1px solid var(--line);background:linear-gradient(160deg,#B7D193,#98B873);aspect-ratio:4/3;max-width:100%;min-width:0}
.mstage svg{position:absolute;inset:0;width:100%;height:100%;display:block}
.mtag{position:absolute;left:14px;top:14px;display:flex;gap:6px;flex-wrap:wrap}
.mtag span{font-family:var(--mono);font-size:10.5px;letter-spacing:.06em;text-transform:uppercase;background:rgba(248,246,242,.92);color:#16130F;border-radius:5px;padding:5px 8px}
.mtag span.t{background:#16130F;color:#fff}
.mchips{position:absolute;left:14px;right:14px;bottom:14px;display:flex;flex-wrap:wrap;gap:6px}
.mchip{display:inline-flex;align-items:baseline;gap:8px;background:rgba(248,246,242,.95);color:#16130F;border-radius:8px;padding:8px 11px;font-size:13px;font-weight:600;box-shadow:0 8px 24px rgba(22,19,15,.12);opacity:0;transform:translateY(10px);filter:blur(4px);transition:opacity .5s,transform .5s cubic-bezier(.2,.8,.2,1),filter .5s}
.mchip b{font-family:var(--mono);font-weight:500;font-variant-numeric:tabular-nums}
.mchip.acc{background:#E5482D;color:#fff}
.mchip.in{opacity:1;transform:none;filter:none}

/* scene parts */
.mroofp{transition:fill .7s}
.mstage[data-m="katus"] .mroofp.f{fill:#E5482D}.mstage[data-m="katus"] .mroofp.b{fill:#B8371F}
.mstage[data-m="paike"] .mroofp.f{fill:#4A4D52}
.meave{stroke:#fff;stroke-width:3;stroke-linecap:round;stroke-dasharray:var(--len);stroke-dashoffset:var(--len);transition:stroke-dashoffset 1s .3s cubic-bezier(.65,0,.35,1)}
.mstage[data-m="katus"] .meave{stroke-dashoffset:0}
.mpanel{fill:#1F3047;stroke:#7F9BBF;stroke-width:.6;opacity:0;transition:opacity .35s}
.mstage[data-m="paike"] .mpanel{opacity:1}
.mwallp{transition:fill .9s}
.mstage[data-m="varv"] .mwallp.f{fill:#9DB2A1}.mstage[data-m="varv"] .mwallp.g{fill:#83998A}

/* ---------- motion layer ---------- */
html{scroll-behavior:smooth}
section[id]{scroll-margin-top:72px}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:40;background:var(--bg)}
.hdr{position:sticky;top:env(safe-area-inset-top,0px);z-index:30;background:transparent;border-bottom:1px solid transparent;transition:background .3s,border-color .3s,backdrop-filter .3s}
.hdr.scrolled{background:color-mix(in srgb,var(--bg) 86%,transparent);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);border-bottom-color:var(--line)}
.sprog{position:fixed;left:0;right:0;top:env(safe-area-inset-top,0px);height:2px;z-index:41;background:var(--accent);transform-origin:0 50%;transform:scaleX(0);pointer-events:none}
.story .pin{top:60px;height:calc(100vh - 60px)}
.rv{opacity:0;transform:translateY(22px);filter:blur(6px);transition:opacity .9s cubic-bezier(.2,.7,.2,1) var(--d,0ms),transform .9s cubic-bezier(.2,.7,.2,1) var(--d,0ms),filter .9s cubic-bezier(.2,.7,.2,1) var(--d,0ms)}
.rv.nb{filter:none}
.rv.in{opacity:1;transform:none;filter:none}
.split .w{display:inline-block;overflow:hidden;vertical-align:top;padding-bottom:.16em;margin-bottom:-.16em}
.split .w>span{display:inline-block;transform:translateY(108%) rotate(2deg);transform-origin:0 100%;transition:transform 1s cubic-bezier(.16,.84,.24,1) var(--d,0ms)}
.split.in .w>span{transform:none}
.split .ul::after{transform:rotate(-1deg) scaleX(0);transform-origin:0 50%;transition:transform .7s cubic-bezier(.65,0,.35,1) var(--ud,600ms)}
.split.in .ul::after{transform:rotate(-1deg) scaleX(1)}
.cols3,.faq{position:relative;border-top-color:transparent}
.cols3::before,.faq::before{content:"";position:absolute;left:0;right:0;top:-1px;height:1px;background:var(--ink);transform:scaleX(0);transform-origin:0 50%;transition:transform 1.2s cubic-bezier(.65,0,.35,1)}
.cols3.in::before,.faq.in::before,.cols3.drawn::before,.faq.drawn::before{transform:scaleX(1)}
.btn{transition:border-color .15s,background .15s,transform .15s cubic-bezier(.2,.8,.2,1),filter .15s}
.btn:active{transform:scale(.97)}
.btn.red .arr{display:inline-block;transition:transform .25s cubic-bezier(.2,.8,.2,1)}
.btn.red:hover .arr{transform:translateX(3px)}
.pkg,.choice,.pcard,.kpi,.s-item,.cols3>div,.flowline li,.lock,.sv-in{transition:transform .45s cubic-bezier(.2,.8,.2,1),border-color .25s,background .25s}
.pkg:hover,.choice:hover,.pcard:hover,.kpi:hover{transform:translateY(-4px);border-color:var(--muted)}
.pkg.pop:hover{border-color:var(--accent)}
.kpi.wide:hover{border-color:var(--accent)}
.s-item:hover{transform:translateX(3px)}
.choice .ic,.prob .ic{transition:transform .45s cubic-bezier(.2,.8,.2,1)}
.choice:hover .ic{transform:translateY(-2px) rotate(-4deg) scale(1.06)}
.tool{transition:background .25s,color .25s}
.mrow{transition:background .2s}
.mrow:hover{background:color-mix(in srgb,var(--soft) 55%,transparent)}
.status{transition:background .3s,color .3s}
.si{animation:siIn .6s cubic-bezier(.2,.8,.2,1) both;animation-delay:var(--d,0ms)}
@keyframes siIn{from{opacity:0;transform:translateY(10px)}}
.bump{animation:bump .5s cubic-bezier(.2,.8,.2,1)}
@keyframes bump{40%{transform:scale(1.08)}}
.toast{animation:toastIn .45s cubic-bezier(.2,.8,.2,1)}
@keyframes toastIn{from{opacity:0;transform:translate(-50%,14px)}}
.confirmed{animation:pop .55s cubic-bezier(.2,.9,.3,1.3)}
@keyframes pop{from{opacity:0;transform:scale(.92)}}
.ac:not([hidden]){animation:acIn .22s cubic-bezier(.2,.8,.2,1)}
@keyframes acIn{from{opacity:0;transform:translateY(-4px)}}
.faq details{interpolate-size:allow-keywords}

}

let composer = null;
function buildComposer(w, h) {
  composer = new EffectComposer(renderer);
  composer.addPass(new RenderPass(scene, camera));
  if (!isSmall) {
    const ao = new GTAOPass(scene, camera, w, h);
    ao.updateGtaoMaterial({radius: 0.6, distanceExponent: 1.5, thickness: 1, scale: 1.2, samples: 12});
    ao.blendIntensity = 0.85;
    composer.addPass(ao);
  }
  composer.addPass(new OutputPass());
}

function resize() {
  const r = host.getBoundingClientRect();
  const w = Math.max(1, r.width), h = Math.max(1, r.height);
  renderer.setSize(w, h, false); camera.aspect = w / h; camera.updateProjectionMatrix();
  if (!resize.fitted && w > 1) { resize.fitted = true; if (camera.aspect < 1.2) { const k = Math.min(2.1, 1.35 / camera.aspect); camera.position.sub(controls.target).multiplyScalar(k).add(controls.target); controls.maxDistance = Math.max(controls.maxDistance, camera.position.distanceTo(controls.target) * 1.3); } }
  if (!composer) buildComposer(w, h); composer.setSize(w, h);
}

  if (grp === 'time') { setTime(b.dataset.v); lamp.intensity = b.dataset.v === 'ohtu' ? 6 : 0; }
  if (grp === 'facade') setFacade(b.dataset.v);
  if (grp === 'roof') setRoof(b.dataset.v);
  if (b.dataset.t) { const on = b.getAttribute('aria-pressed') !== 'true'; b.setAttribute('aria-pressed', on); extT[b.dataset.t] = on ? 1 : 0; }
  if (b.id === 'realSpin') { controls.autoRotate = !controls.autoRotate; b.setAttribute('aria-pressed', controls.autoRotate); }
});

/* ---------- loop (only while visible) ---------- */
let visible = false, raf = 0, snapDone = false;
function frame() {
  if (dead) return;
  raf = requestAnimationFrame(frame);
  for (const k in ext) ext[k] += (extT[k] - ext[k]) * 0.12;
  saunaG.scale.set(1, Math.max(0.001, ext.sauna), 1); saunaG.visible = ext.sauna > 0.01;
  deckG.scale.set(Math.max(0.001, ext.deck), 1, 1); deckG.visible = ext.deck > 0.01;
  controls.update();
  composer.render();
  if (!snapDone) { snapDone = true; setTimeout(snapshot, 300); }
}
function snapshot() {
  try {
    const url = canvas.toDataURL('image/jpeg', 0.86);
    document.querySelectorAll('[data-real-snap]').forEach((img) => (img.src = url));
  } catch (e) { /* ignore */ }
}

let dead = false;
const io = new IntersectionObserver((es) => es.forEach((en) => { visible = en.isIntersecting; cancelAnimationFrame(raf); if (visible) frame(); })); io.observe(host);
// render one frame immediately for the snapshot used elsewhere on the page
composer.render(); snapshot();
host.classList.add('ready');
return () => { dead = true; cancelAnimationFrame(raf); io.disconnect(); removeEventListener('resize', resize); controls.dispose(); scene.traverse((o) => { o.geometry?.dispose(); }); renderer.dispose(); renderer.forceContextLoss?.(); };

function matRows(v,work,reserve){
  const k=1+(reserve||0)/100,rows=[];
  if(['Katus','Mõlemad','Juurdeehitus'].includes(work))rows.push(['Katusekate',v.roof,'m²'],['Räästas / renn',v.eave,'jm']);
  if(['Fassaad','Mõlemad','Juurdeehitus'].includes(work))rows.push(['Fassaad (bruto)',v.wall,'m²'],['Sokkel',v.perimeter,'jm']);
  return rows.map(([n,q,u])=>`<div><span>${n} <span class="num muted">${nf1(q)} ${u}</span></span><b>→ ~${nf1(q*k)} ${u}</b></div>`).join('');
}

/* ---- isometric scene (Rukkiräägu tee 9: 15,68 × 9,58 m, räästas 4,68 m, viilkatus 30°) ---- */
const W=15.68,D=9.58,H=4.68,R=D/2*Math.tan(Math.PI/6),O=.45,s=9.2,k=Math.cos(Math.PI/6);
const P=(x,y,z)=>[((x-y)*k*s).toFixed(1),((x+y)*.5*s-z*s).toFixed(1)];
const poly=(pts)=>pts.map(p=>P(...p).join(',')).join(' ');

svg+=`<polygon class="mplot" points="${poly(plot)}"/>`;

// neighbours
const box=(cx,cy,w,d,h,c1,c2,c3)=>{const a=cx-w/2,b=cx+w/2,e=cy-d/2,f=cy+d/2;return `<polygon points="${poly([[b,e,0],[b,f,0],[b,f,h],[b,e,h]])}" fill="${c2}"/><polygon points="${poly([[a,f,0],[b,f,0],[b,f,h],[a,f,h]])}" fill="${c1}"/><polygon points="${poly([[a,e,h],[b,e,h],[b,f,h],[a,f,h]])}" fill="${c3}"/>`;};
svg+=box(-30,-12,9,8,6,'#E9E4DA','#D3CDC2','#C6C8CA');
svg+=box(26,-26,10,8,6.5,'#E9E4DA','#D3CDC2','#BFC1C3');
// shadow
svg+=`<polygon points="${poly([[x0+1,y0+1,0],[x1+3,y0+1,0],[x1+3,y1+2.5,0],[x0+1,y1+2.5,0]])}" fill="rgba(22,19,15,.18)"/>`;
// house: back roof slope, gable, front wall, front roof slope
svg+=`<polygon class="mroofp b" points="${poly([[x1+O,y0-O,ez],[x0-O,y0-O,ez],[x0-O,0,rz],[x1+O,0,rz]])}" fill="var(--roof2)"/>`;

function parseNum(t){const m=String(t).match(/-?\d[\d   ]*(?:,\d+)?/);if(!m)return null;const raw=m[0].replace(/[   ]+$/,'');const dec=(raw.split(',')[1]||'').length;const v=parseFloat(raw.replace(/[   ]/g,'').replace(',','.'));if(isNaN(v))return null;return {v,dec,pre:t.slice(0,m.index),suf:t.slice(m.index+raw.length)};}
function tweenText(el,to,dur=800,from){
  if(!el)return;const p=parseNum(to);if(RM||!p){el.textContent=to;el._v=p?.v;return;}
  const f=from??el._v??(parseNum(el.textContent)?.v??0);el._v=p.v;cancelAnimationFrame(el._raf);const t0=performance.now();
  const step=now=>{const u=Math.min(1,(now-t0)/dur),e=1-Math.pow(1-u,4),x=f+(p.v-f)*e;
    el.textContent=p.pre+x.toLocaleString('et-EE',{minimumFractionDigits:p.dec,maximumFractionDigits:p.dec})+p.suf;if(u<1)el._raf=requestAnimationFrame(step);else el.textContent=to;};
  el._raf=requestAnimationFrame(step);
}
const COUNT_SEL='.mrow .v,.mat b,.kpi b,.pc-price,.credits,.kv b,.s-item .num';
function countIn(root){if(!root||RM)return;const els=root.matches?.(COUNT_SEL)?[root]:[...root.querySelectorAll(COUNT_SEL)];els.forEach((el,i)=>{if(el.children.length)return;const to=el.textContent;if(!parseNum(to))return;setTimeout(()=>tweenText(el,to,1100,0),i*45);});}
function staggerIn(root,sel){if(!root||RM)return;[...root.querySelectorAll(sel)].forEach((el,i)=>{el.classList.remove('si');void el.offsetWidth;el.style.setProperty('--d',i*70+'ms');el.classList.add('si');});}
function splitWords(el){
  if(el.dataset.split)return;el.dataset.split=1;el.classList.add('split');let i=0;
  const wrap=node=>{const w=document.createElement('span');w.className='w';const inner=document.createElement('span');inner.style.setProperty('--d',(i++*55)+'ms');w.appendChild(inner);return [w,inner];};
  [...el.childNodes].forEach(n=>{
    if(n.nodeType===3){const frag=document.createDocumentFragment();n.textContent.split(/(\s+)/).forEach(tok=>{if(!tok)return;if(/^\s+$/.test(tok)){frag.appendChild(document.createTextNode(' '));return;}const [w,inner]=wrap();inner.textContent=tok;frag.appendChild(w);});n.replaceWith(frag);}
    else if(n.nodeType===1){const [w,inner]=wrap();n.replaceWith(w);inner.appendChild(n);}
  });
  el.style.setProperty('--ud',(i*55+450)+'ms');
}

  saveproj:()=>{if(S.credits<=0){go('dash');return;}const p=createProject();go('project',p.id);toast('Objekt salvestatud');},
  seed:()=>{seed();go('dash');},
  'onb-done':()=>{const id=route.id;id?go('project',id):go('dash');},
  tool:t=>{
    const v=pv(),k=t.dataset.t;if(!v)return;
    if(k==='roof'||k==='walls'){ui.hl=ui.hl===k?null:k;const vv=curVals();v.setTag('roof',`Katus · ${nf1(vv.roof)} m²`);v.setTag('walls',`Seinad · ${nf1(vv.wall)} m²`);v.highlight(ui.hl);}
    if(k==='dims'){ui.dims=!ui.dims;v.setDims(ui.dims);}
    if(k==='top'){ui.top=!ui.top;v.setTop(ui.top);}
    $$('.tool').forEach(b=>{const x=b.dataset.t;b.classList.toggle('on',x==='dims'?ui.dims:x==='top'?ui.top:ui.hl===x);if(x==='dims')b.textContent=`Mõõdud ${ui.dims?'sees':'väljas'}`;});
  },
  edit:t=>{ui.edit=t.dataset.k;refreshPanel();setTimeout(()=>{const i=$('#ed-'+ui.edit);i?.focus();i?.select();},20);},
  'edit-cancel':()=>{ui.edit=null;refreshPanel();},
  'edit-reset':t=>{const p=proj(route.id);delete p.overrides[t.dataset.k];save();refreshPanel();},
  addon:t=>{const p=proj(route.id);p.requests[t.dataset.k]=true;notify(`Päring: ${t.dataset.k==='ext'?'juurdeehitus':'fotorealistlik esitlus'} · ${p.address}`);save();refreshPanel();toast('Päring edastatud meeskonnale');},
  send:()=>{const p=proj(route.id);if(!p.token)p.token=rid(10);if(p.status==='Mustand')p.status='Saadetud';save();refreshPanel();
    const it=$(`.s-item[data-id="${p.id}"] .status`);if(it)it.outerHTML=statusPill(p.status);toast('Link on valmis. Kopeeri ja saada kliendile.');},
  copy:t=>{const i=$('#share');const done=()=>{t.textContent='Kopeeritud';setTimeout(()=>t.textContent='Kopeeri link',1800);};
    try{navigator.clipboard.writeText(i.value).then(done,()=>{i.select();t.textContent='Vajuta Ctrl+C';});}catch(e){i.select();t.textContent='Vajuta Ctrl+C';}},
  'open-client':t=>go('client',t.dataset.t),
  swatch:t=>{const v=pv();if(!v)return;v.setColors({[t.dataset.k]:t.dataset.c});$$(`.swb[data-k="${t.dataset.k}"]`).forEach(b=>b.classList.toggle('on',b===t));},
  confirm:()=>{const p=S.projects.find(x=>x.token===route.id);p.status='Kinnitatud';notify(`Klient kinnitas pakkumise · ${p.address}`);save();$('#clAct').innerHTML=clientActions(p);},
  ask:()=>{ui.ask=!ui.ask;const p=S.projects.find(x=>x.token===route.id);$('#clAct').innerHTML=clientActions(p);if(ui.ask)setTimeout(()=>$('#q-name')?.focus(),20);},
  buyopen:()=>{ui.buy=true;render();},
  buy:t=>{S.credits+=+t.dataset.n;save();ui.buy=false;render();toast(`Lisatud ${t.dataset.n} vaadet`);}
};

/* mallid: enne/pärast */
document.addEventListener('input',e=>{if(e.target.id==='cmpR'){const c=document.getElementById('cmp');c&&c.style.setProperty('--x',e.target.value+'%');}});
document.addEventListener('click',e=>{const t=e.target.closest('.mtab');if(!t)return;
  document.querySelectorAll('.mtab').forEach(b=>b.setAttribute('aria-pressed',b===t?'true':'false'));
  const A=document.getElementById('cmpA'),B=document.getElementById('cmpB'),R=document.getElementById('cmpR'),C=document.getElementById('cmp');
  A.src=t.dataset.a;B.src=t.dataset.b;R.value=50;C.style.setProperty('--x','50%');});
document.addEventListener('click',e=>{
  const t=e.target.closest('[data-go],[data-act]');
  if(!e.target.closest('.addr'))$$('.ac').forEach(l=>l.hidden=true);
  if(!t||t.tagName==='INPUT')return;
  if(t.dataset.go){e.preventDefault();go(t.dataset.go,t.dataset.id||null);return;}
  const f=A[t.dataset.act];if(f){e.preventDefault();f(t,e);}
});
function suggest(input){
  const f=input.closest('form'),ul=f.querySelector('.ac'),q=input.value.trim().toLowerCase();
  f.dataset.bid='';f.querySelector('.err').hidden=true;
  const hits=BUILDINGS.filter(b=>!q||fullAddr(b).toLowerCase().includes(q));
  ul.innerHTML=hits.length?hits.map((b,i)=>`<li data-act="pick" data-id="${b.id}" data-label="${esc(fullAddr(b))}" class="${i===0&&q?'on':''}"><span>${esc(b.addr)}, <span class="muted">${esc(b.area)}</span></span><span class="lbl">${b.missing?'uus':'3D'}</span></li>`).join('')
    :`<li class="hint">Prototüübis on ainult näidisaadressid. Proovi „Rukki“, „Taga“ või „Laane“.</li>`;
  ul.hidden=false;
}
document.addEventListener('input',e=>{
  const t=e.target;
  if(t.matches('.addr input'))return suggest(t);
  if(t.hasAttribute('data-sv'))return calcSave();
  const k=t.dataset.in;if(!k)return;
  if(k==='reserve'){const p=proj(route.id);p.reserve=clamp(+t.value||0,0,40);save();$('#matRows').innerHTML=matRows(vals(p),p.work,p.reserve);}
  if(k==='offer'){const p=proj(route.id);p.offer=t.value;save();
    const s=$('#offerShow');s.textContent=p.offer||'Kirjuta pakkumine';s.classList.toggle('empty',!p.offer);
    const pp=$('#pricePill');pp.textContent=p.offer||'Pakkumine puudub';pp.classList.toggle('none',!p.offer);}
  if(k==='co'){S.company[t.dataset.k]=t.value;save();}
});
document.addEventListener('focusin',e=>{if(e.target.matches('.addr input'))suggest(e.target);});
document.addEventListener('keydown',e=>{if(e.key==='Escape')$$('.ac').forEach(l=>l.hidden=true);});
document.addEventListener('change',async e=>{
  const t=e.target;if(t.type!=='file')return;
  const files=[...t.files];if(!files.length)return;
  if(t.dataset.act==='logo'){const u=await readImg(files[0],240);if(u){S.company.logo=u;save();$$('.logo-prev').forEach(el=>el.innerHTML=`<img src="${u}" alt="">`);}}
  if(t.dataset.act==='photos'){const p=proj(route.id);for(const f of files.slice(0,12)){const u=await readImg(f,320);if(u)p.photos.push(u);}save();refreshPanel();}
  if(t.dataset.act==='nophotos'){draft.photos=draft.photos||[];for(const f of files.slice(0,12)){const u=await readImg(f,320);if(u)draft.photos.push(u);}toast(`${draft.photos.length} pilti ootel`);}
});
const num=s=>parseFloat(String(s).replace(',','.').replace(/\s/g,''));
document.addEventListener('submit',e=>{
  const f=e.target;e.preventDefault();
  const err=m=>{const el=f.querySelector('.err');if(el){el.textContent=m;el.hidden=false;}};
  switch(f.dataset.form){
    case 'addr':{
      let id=f.dataset.bid;
      if(!id){const q=f.q.value.trim().toLowerCase();const hit=q&&BUILDINGS.find(b=>fullAddr(b).toLowerCase().includes(q));if(hit)id=hit.id;}
      if(!id){err('Vali aadress nimekirjast. Prototüübis on viis Viimsi näidisaadressi.');suggest(f.q);return;}
      draft=newDraft();draft.bid=id;draft.step=1;go('new');return;
    }
    case 'manual':{
      const d=Object.fromEntries(new FormData(f));let W=num(d.W),D=num(d.D);const h=num(d.h),pitch=num(d.pitch);
      if(![W,D,h,pitch].every(x=>x>0)||W>60||D>60||h>20||pitch<5||pitch>60){err('Kontrolli mõõte: pikkus ja laius kuni 60 m, kõrgus kuni 20 m, kalle 5–60°.');return;}
      if(D>W)[W,D]=[D,W];
      const b=BUILDINGS.find(x=>x.id===draft.bid);
      draft.custom={id:'custom',ehr:null,label:fullAddr(b)+' (käsitsi)',type:d.type,W,D,h,pitch,o:.5};
      render();return;
    }
    case 'signup':{
      const d=Object.fromEntries(new FormData(f));
      if(!d.name.trim()||!d.company.trim()){err('Täida nimi ja ettevõtte nimi.');return;}
      if(!/^\S+@\S+\.\S+$/.test(d.email)){err('Sisesta korrektne e-posti aadress, nt nimi@firma.ee.');return;}
      S.user={name:d.name.trim(),email:d.email.trim()};Object.assign(S.company,{name:d.company.trim(),email:d.email.trim()});save();
      if(f.dataset.ctx==='flow'){const p=createProject();go('onboard',p.id);}else go('onboard',null);
      return;
    }
    case 'medit':{
      const v=num(f.v.value),p=proj(route.id);
      if(!(v>0)){f.v.focus();return;}
      p.overrides[f.dataset.k]=v;ui.edit=null;save();refreshPanel();const vv=vals(p);pv()?.setTag('roof',`Katus · ${nf1(vv.roof)} m²`);pv()?.setTag('walls',`Seinad · ${nf1(vv.wall)} m²`);return;
    }
    case 'question':{
      const d=Object.fromEntries(new FormData(f));
      if(!d.name.trim()||!d.tel.trim()||!d.msg.trim()){err('Täida nimi, telefon ja sõnum.');return;}
      const p=S.projects.find(x=>x.token===route.id);notify(`Küsimus: ${d.name} (${d.tel}): „${d.msg.slice(0,80)}“ · ${p.address}`);save();
      ui.ask=false;ui.asked=true;$('#clAct').innerHTML=clientActions(p);return;
    }
  }
});

render();
</script>

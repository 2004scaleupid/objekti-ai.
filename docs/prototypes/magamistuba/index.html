:root{--bg:#ECE8E2;--paper:#F8F6F2;--ink:#16130F;--muted:#77706A;--accent:#E5482D;--chip:rgba(255,255,255,.92);--chipfg:#16130F;

:root[data-theme="dark"]{--bg:#1A1816;--paper:#22201D;--ink:#F1ECE5;--muted:#A39B92;color-scheme:dark}
html,body{height:100%}
body{background:var(--bg);color:var(--ink);font-family:var(--sans);overflow:hidden}
#c{position:fixed;inset:0;width:100%;height:100%;display:block;touch-action:none}
header{position:fixed;top:env(safe-area-inset-top,0px);left:0;padding:14px max(16px,env(safe-area-inset-left,0px));pointer-events:none;max-width:60%}
h1{margin:0;font-size:20px;letter-spacing:-.02em}
header p{margin:3px 0 0;color:var(--muted);font-size:13px;max-width:34em}
.src{position:fixed;top:calc(12px + env(safe-area-inset-top,0px));right:max(16px,env(safe-area-inset-right,0px));width:168px;border-radius:10px;overflow:hidden;box-shadow:0 12px 30px rgba(0,0,0,.25);background:#fff}
.src img{display:block;width:100%}
.src span{position:absolute;left:6px;top:6px;font:500 9.5px var(--mono);letter-spacing:.06em;text-transform:uppercase;background:rgba(22,19,15,.8);color:#fff;border-radius:4px;padding:2px 6px}
#ui{position:fixed;left:0;right:0;bottom:calc(14px + env(safe-area-inset-bottom,0px));display:flex;flex-wrap:wrap;gap:6px;justify-content:center;padding:0 max(16px,env(safe-area-inset-left,0px))}
.g{display:flex;gap:2px;padding:3px;border-radius:999px;background:var(--chip);box-shadow:0 6px 20px rgba(0,0,0,.12)}
.g button{border:0;background:none;color:var(--chipfg);font:600 12.5px var(--sans);padding:6px 11px;border-radius:999px;cursor:pointer;display:inline-flex;gap:6px;align-items:center}
.g button.on{background:#16130F;color:#fff}
.sw{width:10px;height:10px;border-radius:50%;border:1px solid rgba(0,0,0,.2)}
#st{position:fixed;inset:0;display:grid;place-items:center;color:var(--muted);font:500 12px var(--mono);pointer-events:none}
@media (max-width:640px){.src{width:96px}header{max-width:70%}header p{display:none}#ui{flex-wrap:nowrap;overflow-x:auto;justify-content:flex-start}.g{flex:none}}

 oak:img('t_oak.jpg',[3.2,4.2]), oakB:raw('t_oak.jpg',[3.2,4.2]), dark:img('t_oak.jpg',[3.2,4.2]),

{// throw: drapes over lower half and both sides

    const down=ease(seg(.1,.42)),pol=.05+down*1.13,az=-.66+p*1.15,d=this.dist*(1.25-.25*down);
    const tgt=new THREE.Vector3(0,this.m.height*.36*down,0);
    this.cam.position.set(Math.sin(pol)*Math.sin(az)*d,Math.cos(pol)*d,Math.sin(pol)*Math.cos(az)*d).add(tgt);this.cam.lookAt(tgt);
    const hl=p>.6&&p<.8?'roof':null;if(hl!==this.hl)this.hl=hl;
    this.colors.roof='#'+new THREE.Color('#3A3D41').lerp(new THREE.Color('#8C3A2B'),seg(.82,.92)).getHexString();
    this.paint();
  }
  paint(){
    const red=new THREE.Color('#E5482D');
    this.house.wallMat.color.set(this.colors.wall);this.house.roofMat.color.set(this.colors.roof);
    if(this.hl==='roof')this.house.roofMat.color.lerp(red,.62);
    if(this.hl==='walls')this.house.wallMat.color.lerp(red,.5);
  }
  highlight(k){this.hl=k;this.paint();}
  setTag(kind,text){const l=this.labels.find(x=>x.kind===kind);if(l)l.el.textContent=text;}
  setColors(c){Object.assign(this.colors,c);this.paint();}
  snapshot(){this.r.render(this.scene,this.cam);return this.r.domElement.toDataURL('image/jpeg',.84);}
  dispose(){
    this.dead=true;cancelAnimationFrame(this.raf);this.ro.disconnect();this.ctrl?.dispose();
    this.scene.traverse(o=>{o.geometry?.dispose();if(o.material)[].concat(o.material).forEach(m=>m.dispose());});
    this.io?.disconnect();this.composer?.dispose?.();this.envRT?.dispose();this.r.dispose();this.r.forceContextLoss?.();this.el.innerHTML='';
  }
}
// lumi -> katus/plaadid: ülespoole vaatavad heledad värvitud pinnad (lumi talvefotodelt) värvitakse ümber; seinad jäävad
function deSnow(root,baseY,THREE){root.traverse(o=>{if(!o.isMesh)return;[].concat(o.material).forEach(mt=>{mt.onBeforeCompile=sh=>{
  sh.uniforms.uBase={value:baseY};
  sh.vertexShader=sh.vertexShader.replace('#include <common>','#include <common>\nvarying float vWY;\nvarying vec3 vWN;').replace('#include <project_vertex>','#include <project_vertex>\nvWY=(modelMatrix*vec4(transformed,1.0)).y;vWN=normalize(mat3(modelMatrix)*normal);');
  sh.fragmentShader=sh.fragmentShader.replace('#include <common>','#include <common>\nvarying float vWY;\nvarying vec3 vWN;\nuniform float uBase;').replace('#include <map_fragment>',`#include <map_fragment>
  {vec3 c=diffuseColor.rgb;float l=dot(c,vec3(.3333));float sat=max(c.r,max(c.g,c.b))-min(c.r,min(c.g,c.b));
   float up=smoothstep(.25,.55,normalize(vWN).y),sn=smoothstep(.20,.36,l)*(1.0-smoothstep(.08,.18,sat))*up;
   bool low=vWY<uBase+0.9;vec3 tgt=low?vec3(.30,.29,.27):vec3(.060,.064,.070);
   float n=fract(sin(dot(floor(gl_FragCoord.xy*.5),vec2(12.9898,78.233)))*43758.5453);
   diffuseColor.rgb=mix(c,tgt*(0.92+0.16*n),sn);}`);};mt.needsUpdate=true;});});}

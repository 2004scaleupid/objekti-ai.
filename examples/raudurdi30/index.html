<!doctype html>
<html lang="et"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Raudürdi tee 30 · 3D</title>
<style>
:root{--mono:"JetBrains Mono",ui-monospace,Menlo,monospace;--sans:"Inter Tight",system-ui,-apple-system,sans-serif}
html,body{margin:0;height:100%;background:#E9E7E1;overflow:hidden;font-family:var(--sans)}
#v{position:absolute;inset:0}#v canvas{display:block;width:100%;height:100%;touch-action:pan-y}
#lab{position:absolute;inset:0;pointer-events:none}
#lab>div{position:absolute;left:0;top:0;font:500 11px/1.3 var(--mono);border-radius:3px;padding:2px 6px;white-space:nowrap;will-change:transform;transition:opacity .4s}
#lab .dim{background:#E5482D;color:#fff}#lab .sdim{background:#16130F;color:#fff}#lab .sedge{background:#fff;color:#16130F;border:1px solid #16130F}
#lab .slab{background:#fff;color:#16130F;border:1px solid #16130F;font-weight:600}#lab .tag{background:#16130F;color:#fff;font:700 12px var(--sans);padding:4px 8px}
#ld{position:absolute;inset:0;display:grid;place-items:center;color:#6f675d;font:500 13px var(--sans)}
#src{position:absolute;left:8px;bottom:8px;font:500 10px var(--mono);color:#16130F;background:rgba(255,255,255,.85);padding:3px 6px;border-radius:3px}
</style></head><body><div id="v"></div><div id="lab"></div><div id="ld">Laadin Maa-ameti andmeid…</div>
<div id="src">Raudürdi tee 30, Maardu · maja 4 fotost · aed, krunt ja mõõdud: Maa- ja Ruumiamet 2026</div>
<script src="../../vendor/three.min.js"></script>
<script src="../../vendor/OrbitControls.js"></script>
<script src="../../vendor/GLTFLoader.js"></script>
<script src="../../vendor/meshopt_decoder.js"></script>
<script>
/* Näidis: meie fotodest tehtud maja + äpi "Aed ja ümbrus" (js/garden.js) Maa-ameti avaandmetest, laetakse otse brauseris. */
const EHR='116069357',C=[553547.9,6592778.79],R=64;
// maja paigutus LOD2 raamis (x = ida, z = -põhi, nullpunkt LOD2 keskpunkt): sobitatud põhiplaani ja harjakõrguse (8,89 m) järgi
const FIT={a:1.362284743429779,cx:1.3045807991065117,cy:-0.2321894328169769,rotY:-3.8746309394274117,s:12.827982930076056,y0:4.439988954476835,off:[2.3800912140126806,0.8124687004647253]};
const LOD2_BASE='https://twubqebmjuvwypeduqqq.supabase.co/storage/v1/object/public/lod2/v1/';
window.lod2Get=async p=>{const r=await fetch(LOD2_BASE+p+'.gz');if(!r.ok)return {};const b=new Uint8Array(await r.arrayBuffer());
  if(b[0]!==0x1f||b[1]!==0x8b)return JSON.parse(new TextDecoder().decode(b));return JSON.parse(await new Response(new Blob([b]).stream().pipeThrough(new DecompressionStream('gzip'))).text());};
window.M3L2={};window.fmt=(v,d=1)=>(+v).toLocaleString('et-EE',{minimumFractionDigits:d,maximumFractionDigits:d});window.fmtM=x=>x.toFixed(2).replace('.',',');
window.m3Redraw=()=>{};
</script>
<script src="../../js/garden.js"></script>
<script>
(async()=>{
const el=document.getElementById('v'),lab=document.getElementById('lab');
const r=new THREE.WebGLRenderer({antialias:true});r.setPixelRatio(Math.min(2,devicePixelRatio||1));r.setSize(el.clientWidth,el.clientHeight);
r.outputEncoding=THREE.sRGBEncoding;r.toneMapping=THREE.ACESFilmicToneMapping;r.shadowMap.enabled=true;r.shadowMap.type=THREE.PCFSoftShadowMap;el.appendChild(r.domElement);
const sc=new THREE.Scene(),cam=new THREE.PerspectiveCamera(32,el.clientWidth/el.clientHeight,.5,3000);
sc.add(new THREE.HemisphereLight(0xffffff,0xb8b2a6,1));
const sun=new THREE.DirectionalLight(0xffffff,2.4);sun.castShadow=true;sun.shadow.mapSize.set(2048,2048);sc.add(sun,sun.target);
const ct=new THREE.OrbitControls(cam,r.domElement);ct.enableDamping=true;ct.enablePan=false;ct.maxPolarAngle=1.42;ct.target.set(0,3,0);
const catcher=new THREE.Object3D();
// maja
const house=new THREE.Group();sc.add(house);
const L2=(await lod2Get(EHR.slice(-3)+'.json'))[EHR];if(!L2){document.getElementById('ld').textContent='LOD2 andmed puuduvad';return;}
M3L2[EHR]=L2;
const glb=await new Promise((ok,no)=>{const l=new THREE.GLTFLoader();l.setMeshoptDecoder(MeshoptDecoder);l.load('maja.glb',ok,undefined,no);});
const m=glb.scene;m.traverse(o=>{if(o.isMesh){o.castShadow=true;o.receiveShadow=true;}});
const inner=new THREE.Group();inner.add(m);inner.scale.setScalar(FIT.s);inner.position.y=FIT.y0;
const pv=new THREE.Group();pv.add(inner);pv.rotation.y=FIT.rotY;const o=new THREE.Group();o.add(pv);o.position.set(FIT.off[0]+FIT.cx,0,FIT.off[1]-FIT.cy);
const rot=new THREE.Group();rot.add(o);rot.rotation.y=-FIT.a;const grow=new THREE.Group();grow.add(rot);house.add(grow);
// aed Maa-ametist (sama mis äpi buildGarden, aga brauseris)
const wms=(svc,layer,px,fmt)=>`https://kaart.maaamet.ee/wms/${svc}?service=WMS&version=1.3.0&request=GetMap&layers=${layer}&styles=&crs=EPSG:3301&bbox=${C[1]-R},${C[0]-R},${C[1]+R},${C[0]+R}&width=${px}&height=${px}&format=${fmt}`+(fmt==='image/png'?'&transparent=true':'');
const [x,y]=C,RR=R+10,rel=c=>c.flatMap(([px,py])=>[+(px-x).toFixed(2),+(py-y).toFixed(2)]);
const ky=await fetch(`https://gsavalik.envir.ee/geoserver/kataster/ows?service=WFS&version=2.0.0&request=GetFeature&typeNames=kataster:ky_kehtiv&outputFormat=application/json&srsName=EPSG:3301&bbox=${x-RR},${y-RR},${x+RR},${y+RR},EPSG:3301&count=200`).then(r=>r.json()).catch(()=>({features:[]}));
const parcels=[];for(const f of ky.features||[]){const g=f.geometry,P=f.properties||{};const polys=g?.type==='Polygon'?[g.coordinates]:g?.type==='MultiPolygon'?g.coordinates:[];for(const p of polys)if(p[0]?.length)parcels.push({t:String(P.tunnus||''),a:String(P.l_aadress||''),p:Number(P.pindala)||0,g:[rel(p[0])]});}
const R2=R+16,base='https://gsavalik.envir.ee/geoserver/etak/ows?service=WFS&version=2.0.0&request=GetFeature&outputFormat=application/json&srsName=EPSG:3301&count=300',bb=`&bbox=${y-R2},${x-R2},${y+R2},${x+R2},urn:ogc:def:crs:EPSG::3301`;
const get=t=>fetch(`${base}&typeNames=etak:${t}${bb}`).then(r=>r.ok?r.json():{features:[]}).catch(()=>({features:[]}));
const [A,J]=await Promise.all([get('e_501_tee_a'),get('e_501_tee_j')]);
const ra=[];for(const f of A.features||[]){const g=f.geometry,polys=g?.type==='Polygon'?[g.coordinates]:g?.type==='MultiPolygon'?g.coordinates:[];for(const p of polys)if(p[0]?.length)ra.push(p.map(rr=>rel(rr)));}
const rl=[];for(const f of J.features||[]){const g=f.geometry,ls=g?.type==='LineString'?[g.coordinates]:g?.type==='MultiLineString'?g.coordinates:[];for(const c of ls)if(c?.length>1)rl.push({w:Math.max(2,Math.min(20,Number(f.properties?.laius)||4)),g:rel(c)});}
const meta={v:4,ehr:EHR,c:C,r:R,files:{ndsm:wms('fotokaart','nDSM',768,'image/png'),fences:wms('kaart','etak_piirded',1536,'image/png')},parcels,roads:{a:ra,l:rl}};
const V={r,sc,cam,ct,sun,catcher,model:house};
const mm={ehr:EHR,fit:{s:1,rot:0,mc:[0,0],lc:[0,0],y0:0,ok:true},gopt:{}};
const G=await V3DGarden.show(V,mm,meta,{});
document.getElementById('ld').remove();
// maja mõõdud (Maa-ameti LOD2): põhiplaani servad punaselt, kõrgus, katus
const ring=[];for(let i=0;i+1<L2.g[0].length;i+=2)ring.push([L2.g[0][i],L2.g[0][i+1]]);
const W=(a,b,h=.06)=>new THREE.Vector3(a,h,-b);
const outline=new THREE.LineLoop(new THREE.BufferGeometry().setFromPoints(ring.map(q=>W(q[0],q[1],.08))),new THREE.LineBasicMaterial({color:0xE5482D,transparent:true}));sc.add(outline);
const labels=[];const add=(cls,txt,P)=>{const d=document.createElement('div');d.className=cls;d.textContent=txt;d.style.opacity=0;lab.appendChild(d);labels.push({d,P});};
ring.forEach((a,i)=>{const b=ring[(i+1)%ring.length],len=Math.hypot(b[0]-a[0],b[1]-a[1]);if(len>=3)add('dim',fmt(len,1)+' m',W((a[0]+b[0])/2,(a[1]+b[1])/2,.1));});
add('tag',`Katus ${fmt(L2.roof,1)} m² · ${Math.round(L2.f[0][1])}°`,new THREE.Vector3(0,L2.ridge+1.4,0));
add('dim',`Kõrgus ${fmt(L2.ridge,1)} m`,new THREE.Vector3(0,L2.ridge*.55,0).add(W(ring[2][0],ring[2][1],0)));
(V.m3S||[]).forEach(s=>add(s.k,s.txt,s.P.length>1?s.P[0].clone().add(s.P[1]).multiplyScalar(.5):s.P[0]));
(V.m3S||[]).filter(s=>s.k==='sdim').forEach(s=>sc.add(new THREE.Line(new THREE.BufferGeometry().setFromPoints(s.P),new THREE.LineDashedMaterial({color:0x16130F,dashSize:.4,gapSize:.25})).computeLineDistances()));
// kaamera ja animatsioon: aed on kohe, maja kerkib, siis mõõdud, siis pöörleb
ct.target.set(0,3,0);cam.position.set(30,30,38);ct.update();
const still=matchMedia('(prefers-reduced-motion: reduce)').matches,t0=performance.now(),ease=x=>x<0?0:x>1?1:1-Math.pow(1-x,3);
grow.scale.y=.001;
addEventListener('resize',()=>{cam.aspect=el.clientWidth/el.clientHeight;cam.updateProjectionMatrix();r.setSize(el.clientWidth,el.clientHeight);});
const v=new THREE.Vector3();
(function loop(t){requestAnimationFrame(loop);const e=still?99:(t-t0)/1000;
  grow.scale.y=Math.max(.001,ease((e-.4)/2));const lf=ease((e-2.4)/.8);outline.material.opacity=Math.min(1,e*1.5);
  ct.autoRotate=!still&&e>3.4;ct.autoRotateSpeed=.7;ct.update();r.render(sc,cam);
  const w=el.clientWidth,h=el.clientHeight;labels.forEach(l=>{v.copy(l.P).project(cam);const ok=v.z<1&&Math.abs(v.x)<1.05&&Math.abs(v.y)<1.05;l.d.style.opacity=ok?lf:0;
    if(ok)l.d.style.transform=`translate(${(v.x+1)/2*w}px,${(1-v.y)/2*h}px) translate(-50%,-50%)`;});
})(t0);
window.__ready=1;try{parent.postMessage({v3dNaidis:'ok'},'*');}catch(_){}
})().catch(e=>{console.error(e);const d=document.getElementById('ld');if(d)d.textContent='Viga: '+e.message;});
</script></body></html>

<!doctype html><html lang="et"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex">
<title>Jõe tn 4 · 3D · Vaade3D</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter+Tight:wght@500;600;700;800&display=swap">
<style>
:root{--ink:#16130F;--paper:#FBFAF7;--line:#DDD7CE;--acc:#2F6B4F;--mut:#6f685f}
*{box-sizing:border-box}html,body{margin:0;height:100%;background:#e9ece8;color:var(--ink);font:14px/1.4 "Inter Tight",Arial,sans-serif;overflow:hidden;-webkit-font-smoothing:antialiased}
#stage{position:fixed;inset:0;touch-action:none}#stage canvas{display:block;width:100%!important;height:100%!important}
#tags{position:fixed;inset:0;pointer-events:none;overflow:hidden}
.tg{position:absolute;transform:translate(-50%,-50%);white-space:nowrap;font:700 12px "Inter Tight",Arial;padding:3px 8px;border-radius:6px;background:#fff;color:var(--ink);box-shadow:0 1px 4px #0003}
.tg.m{background:#14342ae6;color:#fff;font-weight:600}.tg.s{background:#2b6cb0;color:#fff}.tg.w{background:#fffffff0;color:#16130F;border:1px solid #2b6cb0}
.bar{position:fixed;left:12px;right:12px;top:calc(10px + env(safe-area-inset-top));display:flex;gap:8px;flex-wrap:wrap;align-items:center;pointer-events:none}
.bar>*{pointer-events:auto}.ttl{background:#fffffff0;border-radius:12px;padding:7px 12px;box-shadow:0 2px 8px #0002}.ttl b{display:block;font-size:14px}.ttl small{color:var(--mut)}
.seg{display:flex;background:#fffffff0;border-radius:12px;padding:3px;box-shadow:0 2px 8px #0002}.seg button{border:0;background:none;border-radius:9px;padding:7px 11px;font:700 13px "Inter Tight";color:var(--mut);cursor:pointer}.seg button[aria-pressed=true]{background:var(--acc);color:#fff}
.tools{position:fixed;left:12px;right:12px;bottom:calc(12px + env(safe-area-inset-bottom));display:flex;gap:6px;flex-wrap:wrap;justify-content:center;pointer-events:none}
.tools button{pointer-events:auto;border:0;border-radius:12px;padding:10px 14px;font:700 13px "Inter Tight";background:#fffffff0;color:var(--ink);box-shadow:0 2px 8px #0002;cursor:pointer}.tools button[aria-pressed=true]{background:var(--ink);color:#fff}
#hint{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(64px + env(safe-area-inset-bottom));background:#16130fd9;color:#fff;border-radius:999px;padding:6px 14px;font-size:12.5px;pointer-events:none;max-width:92vw;text-align:center}
#card{position:fixed;right:12px;top:80px;width:260px;background:#fff;border-radius:14px;padding:12px 14px;box-shadow:0 8px 30px #0003;display:none}#card b{display:block;font-size:15px;margin-bottom:4px}#card .r{display:flex;justify-content:space-between;gap:10px;font-size:13px;padding:3px 0;border-bottom:1px solid #eee}#card .r span:first-child{color:var(--mut)}#card .r span:last-child{text-align:right}#card button{position:absolute;right:8px;top:6px;border:0;background:none;font-size:18px;cursor:pointer}
#load{position:fixed;inset:0;display:grid;place-items:center;background:#e9ece8;font-weight:700;color:var(--mut)}
@media (max-width:600px){.ttl small{display:none}.seg button{padding:7px 9px}.tools button{padding:9px 10px;font-size:12.5px}#card{left:12px;right:12px;width:auto;top:auto;bottom:calc(70px + env(safe-area-inset-bottom))}.tg{font-size:11px}}
</style>
<script type="importmap">{"imports":{"three":"https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.js","three/addons/":"https://cdn.jsdelivr.net/npm/three@0.170.0/examples/jsm/"}}</script>
</head><body>
<div id="stage"></div><div id="tags"></div><div id="load">Laen 3D-d…</div>
<div class="bar"><div class="ttl"><b>Jõe tn 4, Kostivere</b><small>Ala 11,55 × 8,65 m · Maa-ameti andmed</small></div>
  <div class="seg" id="ver"><button data-v="v1">v1</button><button data-v="v2" aria-pressed="true">v2</button><button data-v="v2b">v2b</button><button data-v="v3">v3</button></div></div>
<div class="tools"><button id="tDim" aria-pressed="false">Näita mõõte</button><button id="tMeas" aria-pressed="false">Mõõda ise</button><button id="tWalk" aria-pressed="false">Jaluta</button><button id="tTop" aria-pressed="false">Pealtvaade</button></div>
<div id="hint">Lohista = pööra · rull/näpistus = suumi · klõpsa esemel = info</div>
<div id="card"><button aria-label="Sulge">×</button><div id="cardB"></div></div>
<script type="module" src="scene.js"></script>
</body></html>

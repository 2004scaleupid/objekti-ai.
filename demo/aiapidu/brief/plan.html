<!doctype html><html lang="et"><head><meta charset="utf-8"><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter+Tight:wght@400;600;700;800&display=swap">
<style>body{margin:0;font:13px "Inter Tight",Arial;color:#16130F;background:#fff}.pg{width:1500px;padding:28px;display:grid;grid-template-columns:1fr 380px;gap:24px}h1{margin:0 0 4px;font-size:24px}.sub{color:#6f685f;margin-bottom:8px}svg{width:100%;height:auto}h2{font-size:11px;text-transform:uppercase;letter-spacing:.08em;color:#6f685f;margin:14px 0 6px}.ck{list-style:none;padding:0;margin:0;display:grid;gap:3px}.ok{color:#2f7a43}.no{color:#c8361b}table{width:100%;border-collapse:collapse}td{padding:3px 2px;border-bottom:1px solid #eee}td:last-child{text-align:right}</style></head><body><div class="pg" id="pg"></div>
<script src="lib/eventplan.js"></script><script src="lib/eventplan-svg.js"></script>
<style>.epbom{width:100%;border-collapse:collapse}.epbom th{text-align:left;font-size:11px;color:#6f685f}.epbom td{padding:3px 2px;border-bottom:1px solid #eee}.unv{background:#fdf0d5;color:#8a5a00;border:1px solid #e8c37a;border-radius:5px;padding:0 5px;font-size:11px;font-weight:700}.eplg{list-style:none;padding:0;margin:6px 0;font-size:12px;color:#8a5a00}.eplg i{display:none}</style>
<script>(async()=>{const id=new URLSearchParams(location.search).get('v');const D=await fetch(id+'-layout.json').then(r=>r.json()),L=D.layout;L.catalog=await fetch('lib/funrent.json').then(r=>r.json());EventPlan.finish(L);
const e=s=>String(s).replace(/[<>&]/g,'');
document.getElementById('pg').innerHTML=`<div><h1>Paigutus ${id} · ${e(L.tent.name.replace(/^Moodultelk \d+ m /,'Moodultelk '))} · seinad ${EventPlan.fmt(L.tent.sideH)} m · hari ${EventPlan.fmt(L.tent.ridgeH)} m</h1><div class="sub">Ala 10 × 7 m · 12 külalist · plaan päris mõõtudes, kaugused meetrites (kood)</div>${EventPlan.svg.svg(L,{width:1080})}</div>
<div><h2>Kontroll</h2><ul class="ck">${L.checks.map(c=>`<li class="${c.ok?'ok':'no'}">${c.ok?'✓':'✗'} ${e(c.text)}</li>`).join('')}</ul>
<h2>Kliendi reeglid (mõõdetud)</h2><ul class="ck">${(()=>{const R=L.rules,M=L.meas||{},f=EventPlan.fmt,C=L.catalog.products,tb=L.items.find(i=>i.kind==='seating').tables[0],P=id=>C.find(p=>p.id===id),st=L.items.find(i=>i.kind==='stage'),ca=L.items.find(i=>i.kind==='catering'),dn=L.items.find(i=>i.kind==='dance');return [`Kõik ${L.chairs} ühe pika laua taga (${tb.nTab} × ${P(tb.product).name.replace('Kandiline laud ','')})`,`Telgi kõrgus: seinad ${f(L.tent.sideH)} m, hari ${f(L.tent.ridgeH)} m; lava kõrgus ${f(st.h!=null?st.h:P(st.product||'podium').spec.h)} m`,`${st.name}, tantsuala ${f(dn.w)} × ${f(dn.d)} m lava kõrval`,`Catering-laud ${f(P(ca.product).spec.w)} × ${f(P(ca.product).spec.d)} m`,`Mööbel seintest ≥ ${f(R.wall)} m (kitsaim ${f(M.wall?M.wall.have:0)} m)`,`Vahekäigud ≥ ${f(R.walk)} m (kitsaim ${f(M.walk?M.walk.have:0)} m), tooli taga ≥ ${f(R.push)} m (kitsaim ${f(M.chairBack?M.chairBack.have:0)} m)`,`Telk ${f(L.tent.W)} × ${f(L.tent.L)} m mahub alale 10 × 7 m`].map(t=>`<li class="ok">✓ ${e(t)}</li>`).join('')})()}</ul>
<h2>Tooted</h2>${EventPlan.svg.bomHtml(L)}<ul class="eplg">${(EventPlan.svg.legendHtml(L).match(/<li class="unv">.*?<\/li>/)||[''])[0]}</ul>
<h2>Kujundus</h2><div>Elegantne ja moodne, roheline + valge, rohelised taimed ja lilled (pildil ja 3D-s; ei võta põrandapinda).</div></div>`;document.body.dataset.ready=1;})();</script></body></html>

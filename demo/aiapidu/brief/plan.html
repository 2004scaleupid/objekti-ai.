<!doctype html><html lang="et"><head><meta charset="utf-8"><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter+Tight:wght@400;600;700;800&display=swap">
<style>body{margin:0;font:13px "Inter Tight",Arial;color:#16130F;background:#fff}.pg{width:1500px;padding:28px;display:grid;grid-template-columns:1fr 380px;gap:24px}h1{margin:0 0 4px;font-size:24px}.sub{color:#6f685f;margin-bottom:8px}svg{width:100%;height:auto}h2{font-size:11px;text-transform:uppercase;letter-spacing:.08em;color:#6f685f;margin:14px 0 6px}.ck{list-style:none;padding:0;margin:0;display:grid;gap:3px}.ok{color:#2f7a43}.no{color:#c8361b}table{width:100%;border-collapse:collapse}td{padding:3px 2px;border-bottom:1px solid #eee}td:last-child{text-align:right}</style></head><body><div class="pg" id="pg"></div>
<script src="../../../js/eventplan.js"></script><script src="../../../js/eventplan-svg.js"></script>
<script>(async()=>{const id=new URLSearchParams(location.search).get('v');const D=await fetch(id+'-layout.json').then(r=>r.json()),L=D.layout;L.catalog=await fetch('../../../js/catalog/funrent.json').then(r=>r.json());
const e=s=>String(s).replace(/[<>&]/g,'');
document.getElementById('pg').innerHTML=`<div><h1>Paigutus ${id} · ${e(L.tent.name.replace(/^Moodultelk \d+ m /,'Moodultelk '))}</h1><div class="sub">Ala 10 × 7 m · 12 külalist · plaan päris mõõtudes, kaugused meetrites (kood)</div>${EventPlan.svg.svg(L,{width:1080})}</div>
<div><h2>Kontroll</h2><ul class="ck">${L.checks.map(c=>`<li class="${c.ok?'ok':'no'}">${c.ok?'✓':'✗'} ${e(c.text)}</li>`).join('')}</ul>
<h2>Kliendi reeglid</h2><ul class="ck"><li class="ok">✓ Kõik 12 ühe pika laua taga (2 × 183 × 76 cm)</li><li class="ok">✓ Poodiumlava 4 × 3 m, tantsuala 2 × 2 m lava kõrval</li><li class="ok">✓ Catering-laud 2 × 0,75 m</li><li class="ok">✓ Mööbel ≥ 0,25 m telgi seintest</li><li class="ok">✓ Vahekäigud ≥ 0,9 m, tooli taga ≥ 0,75 m (nõue 0,6 m)</li><li class="ok">✓ Telk ${e(L.tent.W+' × '+L.tent.L)} m mahub alale 10 × 7 m</li></ul>
<h2>Tooted</h2><table>${L.bom.map(b=>`<tr><td>${e(b.name)}</td><td>${b.qty}</td></tr>`).join('')}</table>
<h2>Kujundus</h2><div>Elegantne ja moodne, roheline + valge, rohelised taimed ja lilled (pildil ja 3D-s; ei võta põrandapinda).</div></div>`;document.body.dataset.ready=1;})();</script></body></html>
